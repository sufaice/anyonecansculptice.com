<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="container nav-container">
      <a href="{{ site.baseurl }}/" class="nav-logo">❄️ Anyone Can Sculpt Ice</a>
      <ul class="nav-links">
        <li><a href="{{ site.baseurl }}/#workshops">Workshops</a></li>
        <li><a href="{{ site.baseurl }}/#birthday">Birthdays</a></li>
        <li><a href="{{ site.baseurl }}/#teambuilding">Team Building</a></li>
        <li><a href="{{ site.baseurl }}/#about">About</a></li>
        <li><a href="{{ site.baseurl }}/#contact">Contact</a></li>
      </ul>
    </div>
  </nav>

  <main>
    {{ content }}
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; {{ site.time | date: "%Y" }} Anyone Can Sculpt Ice. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
